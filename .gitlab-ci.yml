# ai-usage-monitor pipeline
#   test           go vet + go test (every push)
#   build:agents   6 agent binaries -> dist/ (+manifest.json) -> GitLab generic packages
#   build:web      SPA -> web/dist (only when web/package.json exists)
#   release        ko image of cmd/server with agents + pricing.yaml in kodata (default branch)
#   prune:packages delete ai-usage-agent versions beyond the newest KEEP (default 10)
#
# Speed: test/build:agents/build:web run in parallel (needs: []), release waits for all three.
# Caches are keyed on lock files so every branch shares them; the runner stores them in the
# runner's distributed cache. Jobs that only read a cache use
# policy: pull so they never re-upload it.
stages:
  - test
  - build
  - release
  - cleanup

default:
  interruptible: true   # a newer push cancels the running pipeline of the same ref

workflow:
  auto_cancel:
    on_new_commit: interruptible

variables:
  GOCACHE: "$CI_PROJECT_DIR/.go/cache"
  GOPATH: "$CI_PROJECT_DIR/.go"
  GOFLAGS: "-mod=mod"
  KOCACHE: "$CI_PROJECT_DIR/.ko/cache"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

# tag builds get the tag as version, branch builds get 0.0.0-<sha>.
# (GitLab does not expand shell ${VAR:-default} syntax in `variables:`, so compute it in the shell.)
.set-version: &set-version
  - export VERSION="${CI_COMMIT_TAG:-0.0.0-$CI_COMMIT_SHORT_SHA}"
  - echo "VERSION=$VERSION"

.if-default-deploy: &if-default-deploy
  if: ($CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH || $CI_COMMIT_REF_NAME =~ "/gitlab-ci/" || $CI_COMMIT_TAG) && $CI_PIPELINE_SOURCE != 'merge_request_event'

# Go module download cache: shared by every Go job, written only by `test`.
.go-mod-cache: &go-mod-cache
  key:
    files: [go.sum]
    prefix: go-mod
  paths:
    - .go/pkg/mod/

test:
  stage: test
  image: golang:1.27-alpine
  before_script:
    - apk add --no-cache curl
  needs: []
  cache:
    - <<: *go-mod-cache
      policy: pull-push
    - key:
        files: [go.sum]
        prefix: go-build-test
      paths: [.go/cache/]
      policy: pull-push
  script:
    - go vet ./...
    - go test ./...
  tags:
    - docker

build:agents:
  stage: build
  image: golang:1.27-alpine
  needs: []
  rules:
    - <<: *if-default-deploy
  cache:
    - <<: *go-mod-cache
      policy: pull
    # cross-compiled object cache is specific to this job (6 GOOS/GOARCH targets)
    - key:
        files: [go.sum]
        prefix: go-build-agents
      paths: [.go/cache/]
      policy: pull-push
  before_script:
    - apk add --no-cache curl
  script:
    - *set-version
    - scripts/build-agents.sh dist
    - cp scripts/install.sh scripts/install.ps1 scripts/uninstall.sh scripts/uninstall.ps1 dist/
    - scripts/upload-packages.sh dist
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  tags:
    - docker

build:web:
  stage: build
  image: node:22-alpine
  needs: []
  rules:
    - <<: *if-default-deploy
      exists:
        - web/package.json
  cache:
    # npm's download cache keyed on the lockfile; `npm ci` then installs offline-first
    key:
      files: [web/package-lock.json]
      prefix: npm
    paths:
      - .npm/
    policy: pull-push
  script:
    - cd web
    - npm ci --prefer-offline --no-audit --no-fund
    - npm test
    - npm run build
  artifacts:
    paths:
      - web/dist/
    expire_in: 1 week
  tags:
    - docker

release:
  stage: release
  image:
    name: ghcr.io/ko-build/ko:latest
    entrypoint: [""]
  rules:
    - <<: *if-default-deploy
  needs:
    - job: test
    - job: build:agents
      artifacts: true
    - job: build:web
      artifacts: true
      optional: true
  cache:
    - <<: *go-mod-cache
      policy: pull
    - key:
        files: [go.sum]
        prefix: go-build-release
      paths: [.go/cache/, .ko/cache/]
      policy: pull-push
  variables:
    KO_DOCKER_REPO: $CI_REGISTRY_IMAGE
    GOTOOLCHAIN: "auto"
    DOCKER_CONFIG: /tmp/.docker
  script:
    - *set-version
    - mkdir -p /tmp/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf "%s:%s" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > /tmp/.docker/config.json
    # everything the server needs at runtime goes into kodata (served from $KO_DATA_PATH)
    - mkdir -p cmd/server/kodata/downloads
    - cp dist/* cmd/server/kodata/downloads/
    - cp pricing.yaml cmd/server/kodata/pricing.yaml
    - ls -la cmd/server/kodata/downloads web/dist 2>/dev/null || true
    - ko build ./cmd/server --bare --tags latest,$CI_COMMIT_SHORT_SHA${CI_COMMIT_TAG:+,$CI_COMMIT_TAG} --platform linux/amd64,linux/arm64
  resource_group: registry
  tags:
    - docker

# Runs after the upload in build:agents. The newest version is always among the kept ones,
# so this never removes the build that was just published. Tag releases (v*) and "latest" are kept.
prune:packages:
  stage: cleanup
  image: alpine:3.20
  needs:
    - job: build:agents
  rules:
    - <<: *if-default-deploy
  before_script:
    - apk add --no-cache curl jq
  script:
    - sh scripts/prune-packages.sh
  tags:
    - docker
