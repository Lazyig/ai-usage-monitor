<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
  <title id="t">ai-usage-monitor</title>
  <desc id="d">Token usage and API-equivalent cost across Claude Code, Codex CLI and Antigravity CLI</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.14"/>
      <stop offset="0.55" stop-color="#A78BFA" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect width="1280" height="320" rx="24"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="23.5" fill="none" stroke="#334155" stroke-opacity="0.7"/>

  <!-- Icon mark (project favicon, scaled 512 -> 112) -->
  <g transform="translate(64 104) scale(0.21875)">
    <rect width="512" height="512" rx="112" fill="#0F172A"/>
    <rect x="128" y="264" width="64" height="128" rx="16" fill="#2DD4BF"/>
    <rect x="232" y="184" width="64" height="208" rx="16" fill="#FBBF24"/>
    <rect x="336" y="104" width="64" height="288" rx="16" fill="#A78BFA"/>
    <rect x="112" y="408" width="288" height="12" rx="6" fill="#334155"/>
  </g>

  <!-- Wordmark, tagline, legend -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="208" y="140" font-size="66" font-weight="700" fill="#F8FAFC" letter-spacing="-1.5">ai-usage-monitor</text>
    <text x="208" y="186" font-size="24" fill="#94A3B8">Token usage &amp; API-equivalent cost across AI coding CLIs</text>

    <g font-size="19" font-weight="600" fill="#CBD5E1">
      <circle cx="216" cy="230" r="6" fill="#2DD4BF"/>
      <text x="232" y="237">Claude Code</text>
      <circle cx="400" cy="230" r="6" fill="#FBBF24"/>
      <text x="416" y="237">Codex CLI</text>
      <circle cx="560" cy="230" r="6" fill="#A78BFA"/>
      <text x="576" y="237">Antigravity CLI</text>
    </g>
  </g>

  <!-- Dashboard card: stacked usage bars by tool -->
  <g>
    <rect x="904" y="48" width="320" height="224" rx="16" fill="#0F172A" fill-opacity="0.55" stroke="#334155"/>

    <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" letter-spacing="0.5">
      <text x="924" y="78" fill="#94A3B8" font-weight="600">TOKEN USAGE</text>
      <text x="1204" y="78" fill="#475569" text-anchor="end">by tool</text>
    </g>

    <!-- Gridlines -->
    <g stroke="#334155" stroke-opacity="0.6">
      <line x1="924" y1="134" x2="1204" y2="134"/>
      <line x1="924" y1="184" x2="1204" y2="184"/>
    </g>

    <!-- Bars: violet full height (rounded top), amber and teal overlay the lower segments -->
    <g>
      <rect x="936" y="186" width="22" height="52" rx="6" fill="#A78BFA"/>
      <rect x="936" y="196" width="22" height="42" fill="#FBBF24"/>
      <rect x="936" y="210" width="22" height="28" fill="#2DD4BF"/>

      <rect x="970" y="172" width="22" height="66" rx="6" fill="#A78BFA"/>
      <rect x="970" y="184" width="22" height="54" fill="#FBBF24"/>
      <rect x="970" y="202" width="22" height="36" fill="#2DD4BF"/>

      <rect x="1004" y="166" width="22" height="72" rx="6" fill="#A78BFA"/>
      <rect x="1004" y="182" width="22" height="56" fill="#FBBF24"/>
      <rect x="1004" y="206" width="22" height="32" fill="#2DD4BF"/>

      <rect x="1038" y="152" width="22" height="86" rx="6" fill="#A78BFA"/>
      <rect x="1038" y="172" width="22" height="66" fill="#FBBF24"/>
      <rect x="1038" y="194" width="22" height="44" fill="#2DD4BF"/>

      <rect x="1072" y="144" width="22" height="94" rx="6" fill="#A78BFA"/>
      <rect x="1072" y="168" width="22" height="70" fill="#FBBF24"/>
      <rect x="1072" y="198" width="22" height="40" fill="#2DD4BF"/>

      <rect x="1106" y="126" width="22" height="112" rx="6" fill="#A78BFA"/>
      <rect x="1106" y="156" width="22" height="82" fill="#FBBF24"/>
      <rect x="1106" y="184" width="22" height="54" fill="#2DD4BF"/>

      <rect x="1140" y="118" width="22" height="120" rx="6" fill="#A78BFA"/>
      <rect x="1140" y="152" width="22" height="86" fill="#FBBF24"/>
      <rect x="1140" y="188" width="22" height="50" fill="#2DD4BF"/>

      <rect x="1174" y="98" width="22" height="140" rx="6" fill="#A78BFA"/>
      <rect x="1174" y="136" width="22" height="102" fill="#FBBF24"/>
      <rect x="1174" y="176" width="22" height="62" fill="#2DD4BF"/>
    </g>

    <!-- Baseline -->
    <rect x="924" y="244" width="280" height="6" rx="3" fill="#334155"/>
  </g>
</svg>
