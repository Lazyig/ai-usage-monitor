name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

# Serialize publications for the same ref; do not interrupt a tag release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      KO_DOCKER_REPO: ghcr.io/lazyig/ai-usage-monitor
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Repeat checks here so publication never races ahead of a failing CI run.
      - run: go vet ./...
      - run: go test ./...
      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - name: Set version and image tags
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          short_sha="${GITHUB_SHA:0:8}"
          version="0.0.0-$short_sha"
          tags="$short_sha"
          if [[ "$REF_TYPE" == tag ]]; then
            version="$REF_NAME"
            tags="$tags,$REF_NAME"
          elif [[ "$REF_NAME" == main ]]; then
            tags="$tags,latest"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "IMAGE_TAGS=$tags" >> "$GITHUB_ENV"
      - name: Build agents and prepare image data
        run: |
          scripts/build-agents.sh dist
          cp scripts/install.sh scripts/install.ps1 scripts/uninstall.sh scripts/uninstall.ps1 dist/
          mkdir -p cmd/server/kodata/downloads
          cp dist/* cmd/server/kodata/downloads/
          cp pricing.yaml cmd/server/kodata/pricing.yaml
      - uses: ko-build/setup-ko@v0.8
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform image
        run: ko build ./cmd/server --bare --tags "$IMAGE_TAGS" --platform linux/amd64,linux/arm64
      - name: Save release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
