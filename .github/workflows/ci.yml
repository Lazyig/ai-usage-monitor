name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: agent binary has no server-only dependencies
        run: |
          if go list -deps ./cmd/agent | grep -E 'jackc|internal/store'; then
            echo "cmd/agent must not depend on the server's database code" >&2
            exit 1
          fi

  go-postgres:
    # The store and API suites again, on PostgreSQL: storetest gives every test
    # its own schema in AUM_TEST_POSTGRES_URL's database. The database is
    # created with an ICU locale so that a text column missing COLLATE "C"
    # orders differently and fails the paging tests.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # exec: unnamed statements, the mode recommended behind PgBouncer.
        mode: [cache_statement, exec]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: create the test database
        env:
          PGPASSWORD: ci
        run: >-
          psql -h 127.0.0.1 -U postgres -c
          "CREATE DATABASE aum_test LOCALE_PROVIDER icu ICU_LOCALE 'en-US' LOCALE 'C.UTF-8' TEMPLATE template0"
      - run: go test -race ./internal/store/... ./internal/httpapi/... ./cmd/server/...
        env:
          AUM_TEST_POSTGRES_URL: postgres://postgres:ci@127.0.0.1:5432/aum_test?sslmode=disable&default_query_exec_mode=${{ matrix.mode }}

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm --prefix web run build
      - run: go build -o /tmp/review-server ./cmd/server
      - name: Start isolated fixture server
        run: |
          mkdir -p /tmp/review-downloads
          ADMIN_TOKEN=review-only-token SHUTDOWN_DELAY=0 /tmp/review-server \
            --addr 127.0.0.1:18081 --db /tmp/review.db --pricing pricing.yaml \
            --downloads /tmp/review-downloads >/tmp/review-server.log 2>&1 &
          python3 scripts/review-fixture.py --db /tmp/review.db --downloads /tmp/review-downloads
      - run: npm --prefix web run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: |
            /tmp/ai-usage-review/browser-results
            /tmp/review-server.log

  # The agent's Windows code (service state in %ProgramData%, ACLs, migration,
  # paths) only builds and runs here; the Linux job cannot catch it.
  go-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - run: go vet ./...
      - run: go test ./...

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: ./scripts/install_test.ps1
        shell: pwsh
