name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - run: go vet ./...
      - run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm --prefix web run build
      - run: go build -o /tmp/review-server ./cmd/server
      - name: Start isolated fixture server
        run: |
          mkdir -p /tmp/review-downloads
          ADMIN_TOKEN=review-only-token SHUTDOWN_DELAY=0 /tmp/review-server \
            --addr 127.0.0.1:18081 --db /tmp/review.db --pricing pricing.yaml \
            --downloads /tmp/review-downloads >/tmp/review-server.log 2>&1 &
          python3 scripts/review-fixture.py --db /tmp/review.db --downloads /tmp/review-downloads
      - run: npm --prefix web run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: |
            /tmp/ai-usage-review/browser-results
            /tmp/review-server.log

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: ./scripts/install_test.ps1
        shell: pwsh
