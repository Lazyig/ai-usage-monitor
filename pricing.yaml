  provider: google
  effective_from: 2027-01-01
  input: 1.50
  cache_read: 0.15
  output: 7.50
- match: "gemini-3.8-flash"
  provider: google
  effective_to: 2027-01-01
  input: 0.75
  cache_read: 0.075
  output: 3.75
  note: 도입가(2026-12-31까지)
