  input: 5.00
  output: 25.00
  cache_read: 0.50
  cache_write_5m: 6.25
  cache_write_1h: 10.00
- match: "claude-opus-4-*"
  provider: anthropic
  input: 5.00
  output: 25.00
  cache_read: 0.50
  cache_write_5m: 6.25
  cache_write_1h: 10.00
- match: "claude-sonnet-5"
