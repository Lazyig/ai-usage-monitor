# Model price table. USD per 1M tokens. First matching entry wins (path.Match glob on the
# lowercased model name), so specific names come before globs and NEWER periods come before
# older ones for the same model. Sources and access dates are in comments.
#
# Periods: `effective_from` (inclusive) / `effective_to` (exclusive), YYYY-MM-DD, matched against
# the event's UTC day. Only put a boundary where the price actually changed; the oldest row of a
# model has no `effective_from` so nothing near a launch date falls through as "unknown".
# `note` is shown in the UI. Cache storage (per hour) is NOT modelled.
#
# Conventions: `input` excludes cache; `cache_read` = cached input; Claude cache writes are
# 1.25x (5m) / 2x (1h) of input. `long_context` replaces the rates for the WHOLE request when
# its prompt (input + cache) exceeds `threshold` tokens. `alias_of` reuses another entry (resolved
# for the same date) and is shown as "estimated".

# ---------------------------------------------------------------------------------------------
# Anthropic — Claude Code (first-party). No long-context surcharge on Claude 4.6+ (1M ctx at
# standard rate). Source: https://platform.claude.com/docs/en/about-claude/pricing and
# https://platform.claude.com/docs/en/release-notes/api (2026-10-01)
- match: "claude-opus-5-5"        # launched 2026-09-22
  provider: anthropic
  input: 4.00
  cache_read: 0.20
  cache_write_5m: 5.00
  cache_write_1h: 8.00
  output: 20.00
- match: "claude-opus-5-5*"       # dated snapshots / reasoning suffixes
  provider: anthropic
  alias_of: "claude-opus-5-5"
- match: "claude-opus-5.5*"
  provider: anthropic
  alias_of: "claude-opus-5-5"
- match: "claude-5-5*"
  provider: anthropic
  alias_of: "claude-opus-5-5"
- match: "claude-5.5*"
  provider: anthropic
  alias_of: "claude-opus-5-5"
- match: "claude-sonnet-5-5"      # launched 2026-09-28
  provider: anthropic
  input: 2.00
  cache_read: 0.20
  cache_write_5m: 2.50
  cache_write_1h: 4.00
  output: 10.00
- match: "claude-sonnet-5-5*"     # dated snapshots / reasoning suffixes
  provider: anthropic
  alias_of: "claude-sonnet-5-5"
- match: "claude-sonnet-5.5*"
  provider: anthropic
  alias_of: "claude-sonnet-5-5"
- match: "claude-fable-5-1"       # launched 2026-09-01
  provider: anthropic
  input: 10.00
  cache_read: 0.25                # 0.025x, unique to Fable/Mythos 5.1
  cache_write_5m: 12.50
  cache_write_1h: 20.00
  output: 50.00
- match: "claude-fable-5"         # launched 2026-06-09
  provider: anthropic
  input: 10.00
  cache_read: 1.00
  cache_write_5m: 12.50
  cache_write_1h: 20.00
  output: 50.00
- match: "claude-opus-5"          # launched 2026-07-24; fast mode ($10/$50) not distinguished in logs
  provider: anthropic
  input: 5.00
  cache_read: 0.50
  cache_write_5m: 6.25
  cache_write_1h: 10.00
  output: 25.00
- match: "claude-sonnet-5"        # launched 2026-06-30 at introductory $2/$10; made the standard price
  provider: anthropic             # on 2026-08-10, the scheduled 2026-09-01 rise to $3/$15 was cancelled
  input: 2.00
  cache_read: 0.20
  cache_write_5m: 2.50
  cache_write_1h: 4.00
  output: 10.00
  note: 도입가가 정가로 확정(2026-08-10)
- match: "claude-haiku-4-5*"
  provider: anthropic
  input: 1.00
  cache_read: 0.10
  cache_write_5m: 1.25
  cache_write_1h: 2.00
  output: 5.00

# Claude called through Vertex AI by Antigravity. Google bills these; the Vertex price table
# could not be fetched, so Anthropic list price is used as an estimate (regional endpoints
# add 10%). "-thinking" is a mode: thinking tokens bill as output.
- match: "claude-opus-4-6-thinking"
  provider: vertex
  alias_of: "claude-opus-4-6"
- match: "claude-sonnet-4-6"      # launched 2026-02-17
  provider: vertex
  estimated: true
  input: 3.00
  cache_read: 0.30
  cache_write_5m: 3.75
  cache_write_1h: 6.00
  output: 15.00
- match: "claude-opus-4-6"        # launched 2026-02-05
  provider: vertex
  estimated: true
  input: 5.00
  cache_read: 0.50
  cache_write_5m: 6.25
  cache_write_1h: 10.00
  output: 25.00
- match: "claude-opus-4-*"        # opus-4-8 (2026-05-28) and other 4.x: $5/$25
  provider: anthropic
  input: 5.00
  cache_read: 0.50
  cache_write_5m: 6.25
  cache_write_1h: 10.00
  output: 25.00

# ---------------------------------------------------------------------------------------------
# OpenAI — Codex CLI. terra/sol/luna are distinct public models (launched 2026-07-09), never glob
# them. >272K input tokens: 2x input (cached too) and 1.5x output for the full request, in every
# period. Sources: https://developers.openai.com/api/docs/pricing , .../changelog ,
# .../models/gpt-5.6-sol|terra|luna , .../models/gpt-6-astra|sol|luna , .../models/gpt-6.1-sol (2026-10-01). Pre-cut cache_read values are 0.1x input (inferred).
- match: "gpt-6.1-sol"            # launched 2026-09-29 (1M context); first OpenAI model with billed cache writes
  provider: openai
  input: 2.00
  cache_read: 0.10
  cache_write: 2.50
  output: 10.00
  long_context: { threshold: 272000, input: 4.00, cache_read: 0.20, cache_write: 5.00, output: 15.00 }
- match: "gpt-6.1-sol*"           # dated snapshots / reasoning suffixes
  provider: openai
  alias_of: "gpt-6.1-sol"
- match: "gpt-6-astra"            # launched 2026-09-03 (1M context). Source: https://developers.openai.com/api/docs/pricing
  provider: openai
  input: 10.00
  cache_read: 1.00
  output: 50.00
  long_context: { threshold: 272000, input: 20.00, cache_read: 2.00, output: 75.00 }
- match: "gpt-6-astra*"           # dated snapshots / reasoning suffixes
  provider: openai
  alias_of: "gpt-6-astra"
- match: "gpt-6-sol"              # launched 2026-09-22 (1M context). Source: https://developers.openai.com/api/docs/pricing
  provider: openai
  input: 2.00
  cache_read: 0.20
  output: 10.00
  long_context: { threshold: 272000, input: 4.00, cache_read: 0.40, output: 15.00 }
- match: "gpt-6-sol*"             # dated snapshots / reasoning suffixes
  provider: openai
  alias_of: "gpt-6-sol"
- match: "gpt-6-luna"             # launched 2026-09-22 (1M context). Source: https://developers.openai.com/api/docs/pricing
  provider: openai
  input: 0.10
  cache_read: 0.01
  output: 0.50
  long_context: { threshold: 272000, input: 0.20, cache_read: 0.02, output: 0.75 }
- match: "gpt-6-luna*"            # dated snapshots / reasoning suffixes
  provider: openai
  alias_of: "gpt-6-luna"
- match: "gpt-6"                  # bare alias routes to Astra
  provider: openai
  alias_of: "gpt-6-astra"
- match: "gpt-5.6-sol"            # promotional cut 2026-08-21; "at least through 2026-11-21".
  provider: openai                # No reversion is announced — recheck after 2026-11-21.
  effective_from: 2026-08-21
  input: 4.00
  cache_read: 0.40
  output: 20.00
  long_context: { threshold: 272000, input: 8.00, cache_read: 0.80, output: 30.00 }
  note: 프로모션 단가(최소 2026-11-21까지)
- match: "gpt-5.6-sol"            # launch price
  provider: openai
  effective_to: 2026-08-21
  input: 5.00
  cache_read: 0.50
  output: 30.00
  long_context: { threshold: 272000, input: 10.00, cache_read: 1.00, output: 45.00 }
- match: "gpt-5.6-terra"          # 20% cut on 2026-07-30
  provider: openai
  effective_from: 2026-07-30
  input: 2.00
  cache_read: 0.20
  output: 12.00
  long_context: { threshold: 272000, input: 4.00, cache_read: 0.40, output: 18.00 }
- match: "gpt-5.6-terra"          # launch price
  provider: openai
  effective_to: 2026-07-30
  input: 2.50
  cache_read: 0.25
  output: 15.00
  long_context: { threshold: 272000, input: 5.00, cache_read: 0.50, output: 22.50 }
- match: "gpt-5.6-luna"           # 80% cut on 2026-07-30
  provider: openai
  effective_from: 2026-07-30
  input: 0.20
  cache_read: 0.02
  output: 1.20
  long_context: { threshold: 272000, input: 0.40, cache_read: 0.04, output: 1.80 }
- match: "gpt-5.6-luna"           # launch price
  provider: openai
  effective_to: 2026-07-30
  input: 1.00
  cache_read: 0.10
  output: 6.00
  long_context: { threshold: 272000, input: 2.00, cache_read: 0.20, output: 9.00 }
- match: "gpt-5.6"                # bare alias routes to Sol
  provider: openai
  alias_of: "gpt-5.6-sol"
- match: "codex-auto-review"      # Codex's built-in reviewer; not a billable API model. It runs
  provider: openai                # on gpt-5.6-sol (high) by default — priced as Sol, estimated.
  alias_of: "gpt-5.6-sol"         # https://github.com/openai/codex/issues/20981

# ---------------------------------------------------------------------------------------------
# Google — Antigravity CLI. Thinking tokens bill as output. Suffixes (-control, -a, -c, -exp-a,
# -low) are Antigravity-internal experiment arms / reasoning levels, priced as the base model
# (estimated). Sources: https://ai.google.dev/gemini-api/docs/pricing ,
# https://ai.google.dev/gemini-api/docs/changelog (2026-09-03)
