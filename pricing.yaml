# USD per 1M tokens. First matching entry wins (path.Match glob on lowercased model name).
# Anthropic rates: claude-api skill cache 2026-06-24. Cache read = 10% of input except Fable 5.1 ($0.25),
# cache write 5m = 1.25x input, 1h = 2x input. Long-context (>200K) surcharge: verify before relying on it.
- match: "claude-fable-5-1"
  provider: anthropic
  input: 10.00
  output: 50.00
  cache_read: 0.25
  cache_write_5m: 12.50
  cache_write_1h: 20.00
- match: "claude-fable-5"
  provider: anthropic
  input: 10.00
  output: 50.00
  cache_read: 1.00
  cache_write_5m: 12.50
  cache_write_1h: 20.00
- match: "claude-opus-5"
